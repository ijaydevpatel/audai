[tool.poetry]
name = "audai-backend"
version = "0.1.0"
description = "FastAPI backend for Audai Katha enhancement"
authors = ["Audai Labs <hello@audai.dev>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
python-multipart = "^0.0.9"
sqlmodel = "^0.0.16"
psycopg2-binary = "^2.9.9"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
celery = "^5.3.6"
redis = "^5.0.4"
boto3 = "^1.34.82"
httpx = "^0.27.0"
librosa = "^0.10.1"
soundfile = "^0.12.1"
numpy = "^1.26.4"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.4"
pytest = "^8.1.1"

[build-system]
requires = ["poetry-core>=1.6.1"]
build-backend = "poetry.core.masonry.api"
